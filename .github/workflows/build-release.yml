name: Build V4

on:
  push:
    branches: [main, v4-development]
    tags: ['v4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build -A x64
          -DPS2BR_BUILD_GUI=ON
          -DPS2BR_ENABLE_CHD=ON
          -DPS2BR_BUILD_TESTS=ON
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/stage

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release

      - name: Verify single executable
        shell: pwsh
        run: |
          if (-not (Test-Path "stage/PS2-Batch-Renamer-V4.exe")) { throw "V4 executable was not produced" }
          Get-ChildItem stage

      - uses: actions/upload-artifact@v4
        with:
          name: PS2-Batch-Renamer-V4-Windows-x64
          path: stage/PS2-Batch-Renamer-V4.exe
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libdbus-1-dev libgl1-mesa-dev libpulse-dev \
            libudev-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev \
            libxi-dev libxrandr-dev libxss-dev libxtst-dev mame-tools
          python3 -m pip install --user cmake ninja

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DPS2BR_BUILD_GUI=ON
          -DPS2BR_ENABLE_CHD=ON
          -DPS2BR_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/AppDir/usr

      - name: Build and test
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          cmake --install build

      - name: Package AppImage
        env:
          ARCH: x86_64
          OUTPUT: PS2-Batch-Renamer-V4-Linux-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          curl -L --fail --retry 3 \
            -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/PS2-Batch-Renamer-V4 \
            --desktop-file packaging/linux/ps2-batch-renamer.desktop \
            --icon-file assets/ps2-batch-renamer.svg \
            --output appimage
          test -f "$OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PS2-Batch-Renamer-V4-Linux-x86_64
          path: PS2-Batch-Renamer-V4-Linux-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v4.')
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum PS2-Batch-Renamer-V4.exe PS2-Batch-Renamer-V4-Linux-x86_64.AppImage > SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" \
            PS2-Batch-Renamer-V4.exe \
            PS2-Batch-Renamer-V4-Linux-x86_64.AppImage \
            SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "PS2 Batch Renamer ${GITHUB_REF_NAME}" \
            --generate-notes
