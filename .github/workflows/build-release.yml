name: Build V4

on:
  push:
    branches: [main, v4-development]
    tags: ['v4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build -A x64
          -DPS2BR_BUILD_GUI=ON
          -DPS2BR_ENABLE_CHD=ON
          -DPS2BR_BUILD_TESTS=ON
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/stage

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release

      - name: Verify single executable
        shell: pwsh
        run: |
          if (-not (Test-Path "stage/PS2-Batch-Renamer-V4.exe")) { throw "V4 executable was not produced" }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class PeResource {
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern IntPtr LoadLibraryEx(string fileName, IntPtr file, uint flags);
              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern IntPtr FindResource(IntPtr module, IntPtr name, IntPtr type);
              [DllImport("kernel32.dll")]
              public static extern bool FreeLibrary(IntPtr module);
          }
          '@
          $exe = (Resolve-Path "stage/PS2-Batch-Renamer-V4.exe").Path
          $module = [PeResource]::LoadLibraryEx($exe, [IntPtr]::Zero, 0x00000002)
          if ($module -eq [IntPtr]::Zero) { throw "Could not inspect V4 executable resources" }
          try {
              $icon = [PeResource]::FindResource($module, [IntPtr]101, [IntPtr]14)
              if ($icon -eq [IntPtr]::Zero) { throw "V4 executable has no embedded application icon" }
          } finally {
              [void][PeResource]::FreeLibrary($module)
          }
          Get-ChildItem stage

      - uses: actions/upload-artifact@v4
        with:
          name: PS2-Batch-Renamer-V4-Windows-x64
          path: stage/PS2-Batch-Renamer-V4.exe
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libdbus-1-dev libgl1-mesa-dev libpulse-dev \
            libudev-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev \
            libxi-dev libxrandr-dev libxss-dev libxtst-dev mame-tools \
            scrot xauth xvfb
          python3 -m pip install --user cmake ninja

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DPS2BR_BUILD_GUI=ON
          -DPS2BR_ENABLE_CHD=ON
          -DPS2BR_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/AppDir/usr

      - name: Build and test
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          cmake --install build

      - name: Smoke-test ImGui window
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" bash -euxo pipefail <<'EOF'
          ./AppDir/usr/bin/PS2-Batch-Renamer-V4 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 3
          if ! kill -0 "$app_pid" 2>/dev/null; then
            wait "$app_pid"
            exit 1
          fi
          scrot build/v4-ui-smoke.png
          test -s build/v4-ui-smoke.png
          kill "$app_pid"
          wait "$app_pid" || true
          trap - EXIT
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: PS2-Batch-Renamer-V4-UI-Smoke
          path: build/v4-ui-smoke.png
          if-no-files-found: error

      - name: Package AppImage
        env:
          ARCH: x86_64
          OUTPUT: PS2-Batch-Renamer-V4-Linux-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          curl -L --fail --retry 3 \
            -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/PS2-Batch-Renamer-V4 \
            --desktop-file packaging/linux/ps2-batch-renamer.desktop \
            --icon-file assets/ps2-batch-renamer.svg \
            --output appimage
          test -f "$OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PS2-Batch-Renamer-V4-Linux-x86_64
          path: PS2-Batch-Renamer-V4-Linux-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v4.')
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum PS2-Batch-Renamer-V4.exe PS2-Batch-Renamer-V4-Linux-x86_64.AppImage > SHA256SUMS.txt
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              PS2-Batch-Renamer-V4.exe \
              PS2-Batch-Renamer-V4-Linux-x86_64.AppImage \
              SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "PS2 Batch Renamer ${GITHUB_REF_NAME}" \
              --notes-file "${GITHUB_WORKSPACE}/RELEASE_NOTES_V4.md"
          else
            gh release create "${GITHUB_REF_NAME}" \
              PS2-Batch-Renamer-V4.exe \
              PS2-Batch-Renamer-V4-Linux-x86_64.AppImage \
              SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --title "PS2 Batch Renamer ${GITHUB_REF_NAME}" \
              --notes-file "${GITHUB_WORKSPACE}/RELEASE_NOTES_V4.md"
          fi
